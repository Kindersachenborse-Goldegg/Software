services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ksb
      POSTGRES_PASSWORD: ksb
      POSTGRES_DB: ksb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  app:
    build: .

    environment:
      - DATABASE_URL=postgresql+psycopg://ksb:ksb@db:5432/ksb
  
    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - type: bind
        source: ./fullchain.pem
        target: /cert/fullchain.pem
      - type: bind
        source: ./privkey.pem
        target: /cert/privkey.pem

volumes:
  pgdata: