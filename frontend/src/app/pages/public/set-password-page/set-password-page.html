<header class="center">
    <h1>Passwort vergessen?</h1>
    <p>Setzen Sie ihr neues Passwort</p>
</header>

<form [formRoot]="form" class="form">
    <password-input [formField2]="form.password" inputId="password1" autocomplete="new-password" label="Passwort" />
    <password-input [formField2]="form.password2" inputId="password1" autocomplete="off" label="Passwort wiederholen" />
    <error-list [form]="form" />

    <custom-button type="success" [disabled]="form().invalid()">
        <spinner [resource]="resource()" />Speichern
    </custom-button>
</form>

<custom-popup [(open)]="showPopup">
    <h1>Passwort geändert</h1>
    <p>Ihr Passwort wurde erfolgreich geändert</p>
    <custom-button type="success" routerLink="/login">Zur Anmeldeseite</custom-button>
</custom-popup>
