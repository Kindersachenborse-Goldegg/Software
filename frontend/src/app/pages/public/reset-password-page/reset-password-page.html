<header class="center">
    <h1>Passwort vergessen?</h1>
    <p>Wir senden Ihnen eine Email zum Zurücksetzen</p>
</header>

<form [formRoot]="form" class="form">
    <email-input [formField2]="form.email" inputId="email" autocomplete="email" label="Email" [autofocus]="true" />
    <error-list [form]="form" />
    <custom-button [disabled]="form().invalid()" class="success reset-button">
        <spinner [resource]="resource()" />Zurücksetzen
    </custom-button>
</form>

<custom-popup [(open)]="showPopup">
    <h1>Email gesendet</h1>
    <p>Es kann einige Minuten dauern, bis das Email bei Ihnen eingeht. Überprüfen Sie auch den Spam-Ordner</p>
    <custom-button class="success" routerLink="/login">Zur Anmeldeseite</custom-button>
</custom-popup>
