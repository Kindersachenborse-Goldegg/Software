<header class="center">
    <h1>Registrierung</h1>
    <p>Registrieren Sie sich hier für einen Verkaufplatz</p>
</header>

@if (isFirst()) {
<form [formRoot]="form1" class="form">
    <text-input inputId="firstname" [formField2]="form1.firstname" autocomplete="given-name" label="Vorname" />
    <text-input inputId="lastname" [formField2]="form1.lastname" autocomplete="family-name" label="Nachname" />
    <text-input inputId="city" [formField2]="form1.city" autocomplete="address-level2" label="Ort" />
    <tel-input inputId="phone" [formField2]="form1.phone" autocomplete="tel" label="Telefonnummer" />

    <error-list [form]="form1" />

    <custom-button class="success" [disabled]="form1().invalid()">
        <spinner [resource]="resource()" />Weiter
    </custom-button>
</form>

} @else {
<form [formRoot]="form2" class="form">

    <email-input inputId="email" [formField2]="form2.email" autocomplete="email" label="E-Mail" />

    <password-input inputId="password" [formField2]="form2.password" autocomplete="new-password" label="Passwort" />
    <password-input inputId="password2" [formField2]="form2.password2" autocomplete="off"
        label="Passwort wiederholen" />

    <checkbox-input inputId="tnc" [formField2]="form2.accept_tnc" autocomplete="off" [showErrorList]="false">Ich
        stimme den Regeln zu</checkbox-input>

    <error-list [form]="form2" />

    <custom-button class="success" [disabled]="form2().invalid()">
        <spinner [resource]="resource()" />Registrieren
    </custom-button>
</form>
}

<custom-popup [(open)]="showPopup">
    <h1>Erfolgreich Registriert</h1>
    <p>Bevor Sie diese Seite verwenden können, müssen Sie binnen 24h Ihre Email-Adresse bestätigen</p>
    <custom-button class="success" routerLink="/login">Zur Anmeldeseite</custom-button>
</custom-popup>
