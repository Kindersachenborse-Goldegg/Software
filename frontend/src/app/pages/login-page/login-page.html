<header class="center">
    <div class="stack">
        <img src="image.png">
        <h1>Login</h1>
    </div>
</header>

<form [formRoot]="form" class="form">
    <email-input inputId="email" autocomplete="email" label="Email" [formField2]="form.username" class="hide-required"
        placeholder="email@example.com" />
    <password-input inputId="password" autocomplete="current-password" label="Passwort" [formField2]="form.password"
        class="hide-required" placeholder="Passwort" />

    <error-list [form]="form" />


    <div class="rightbound">
        <a routerLink="/public/reset-password" [state]="{'email': form().value().username}">Passwort vergessen?</a>
    </div>

    <custom-button class="login-button success" [disabled]="form().invalid()">
        <spinner [resource]="resource()" /> Anmelden
    </custom-button>
    <custom-button class="register-button neutral" [isNoSubmit]="true"
        routerLink="/public/register">Registrieren</custom-button>
</form>
