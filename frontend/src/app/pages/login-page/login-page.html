<header class="center">
    <h1>Login</h1>
    <p>Melden Sie sich mit Ihren aktuellen Daten an</p>
</header>

<form [formRoot]="form" class="form">
    <email-input inputId="email" autocomplete="email" label="Email" [formField2]="form.username"
        class="hide-required" />
    <password-input inputId="password" autocomplete="current-password" label="Passwort" [formField2]="form.password"
        class="hide-required" />

    <error-list [form]="form" />


    <div class="rightbound">
        <a routerLink="/public/reset-password" [state]="{'email': form().value().username}">Passwort vergessen?</a>
    </div>

    <custom-button type="success" class="login-button" [disabled]="form().invalid()">
        <spinner [resource]="resource()" /> Anmelden
    </custom-button>
    <custom-button type="neutral" class="register-button" [isNoSubmit]="true"
        routerLink="/public/register">Registrieren</custom-button>
</form>
